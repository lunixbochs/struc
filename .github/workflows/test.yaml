on:
    push:
        branches: ["dev"]
    pull_request:
        branches: ["main"]

name: Test

jobs:
    test:
        strategy:
            matrix:
                go-version: [1.23.x, 1.24.x]
                os: [ubuntu-latest, macos-15, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/setup-go@v4
              with:
                  go-version: "${{ matrix.go-version }}"
            - uses: actions/checkout@v3
            - name: Test
              run: go mod tidy && go test -v ./...
